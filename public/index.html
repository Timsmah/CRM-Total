<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CRM Bangkok</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/js/i18n.js?v=2"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="hidden">
    <div class="login-card">
      <div class="login-logo">🏙️</div>
      <h1>CRM Bangkok</h1>
      <p class="login-sub">Real Estate Agent · Bangkok</p>
      <form id="login-form">
        <input type="email" id="email-input" placeholder="Email" autocomplete="email" style="margin-bottom:8px">
        <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="current-password">
        <button type="submit">Connexion</button>
        <p id="login-error" class="error hidden">Identifiants incorrects</p>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <aside id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">🏙️</span>
        <span class="logo-text">Tim<span>THLD</span></span>
      </div>

      <!-- Global search -->
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="🔍 Search…" autocomplete="off"
          oninput="Search.query(this.value)"
          onfocus="Search.query(this.value)"
          onkeydown="if(event.key==='Escape'){Search.hide();this.value='';}">
        <div id="search-panel" class="search-panel hidden"></div>
      </div>

      <nav>
        <a href="#dashboard" class="nav-item" data-section="dashboard">
          <span class="nav-icon">📊</span><span data-i18n="nav_dashboard">Dashboard</span>
        </a>
        <span class="nav-section-label" data-i18n="nav_pipeline">Pipeline</span>
        <a href="#clients" class="nav-item" data-section="clients">
          <span class="nav-icon">👥</span><span data-i18n="nav_clients">Clients</span>
        </a>
        <a href="#recherches" class="nav-item" data-section="recherches">
          <span class="nav-icon">🔍</span><span data-i18n="nav_recherches">Recherches</span>
        </a>
        <a href="#properties" class="nav-item" data-section="properties">
          <span class="nav-icon">🏠</span><span data-i18n="nav_properties">Properties</span>
        </a>
        <a href="#contracts" class="nav-item" data-section="contracts">
          <span class="nav-icon">📋</span><span data-i18n="nav_contracts">Contracts</span>
        </a>
        <span class="nav-section-label" data-i18n="nav_tools">Outils</span>
        <a href="#finance" class="nav-item" data-section="finance">
          <span class="nav-icon">💰</span><span data-i18n="nav_finance">Finance</span>
        </a>
        <a href="#visas" class="nav-item" data-section="visas">
          <span class="nav-icon">🛂</span><span data-i18n="nav_visas">Visas</span>
        </a>
        <a href="#scraping" class="nav-item" data-section="scraping" id="nav-scraping" style="display:none">
          <span class="nav-icon">🕵️</span><span>Scraping</span>
        </a>
      </nav>
      <!-- User profile block -->
      <div id="sidebar-user" style="margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s" onclick="App.openProfileModal()" onmouseenter="this.style.background='var(--surface-3)'" onmouseleave="this.style.background=''">
        <div id="sidebar-avatar" style="width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden"></div>
        <div style="flex:1;min-width:0">
          <div id="sidebar-name" style="font-size:12.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</div>
          <div id="sidebar-role" style="font-size:10.5px;color:var(--text-3)"></div>
        </div>
      </div>
      <div id="sidebar-footer-btns" style="display:flex;gap:6px;margin-top:4px;margin-bottom:2px">
        <button id="lang-toggle" onclick="setLang(getLang()==='en'?'fr':'en')"
          style="flex:1;background:none;border:1px solid var(--border);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:12px;color:var(--text-2)">
          🇫🇷 FR
        </button>
        <button id="logout-btn" data-i18n="nav_logout" style="flex:1;font-size:12px;padding:5px 8px">⎋</button>
      </div>
      <button id="admin-users-btn" onclick="App.openAdminUsers()" style="display:none;margin-top:2px;background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:11.5px;color:var(--text-2);width:100%;text-align:left">👥 Comptes</button>
    </aside>

    <main id="content"></main>

    <!-- BOTTOM NAV (mobile only) -->
    <nav id="bottom-nav">
      <a class="bnav-item" data-section="dashboard" onclick="Router.navigate('dashboard')">
        <span class="bnav-icon">📊</span><span class="bnav-label">Home</span>
      </a>
      <a class="bnav-item" data-section="clients" onclick="Router.navigate('clients')">
        <span class="bnav-icon">👥</span><span class="bnav-label">Clients</span>
      </a>
      <a class="bnav-item" data-section="properties" onclick="Router.navigate('properties')">
        <span class="bnav-icon">🏠</span><span class="bnav-label">Biens</span>
      </a>
      <a class="bnav-item" id="bnav-more" onclick="MobileMenu.toggle()">
        <span class="bnav-icon">⋯</span><span class="bnav-label">Plus</span>
      </a>
    </nav>

    <!-- MOBILE MORE MENU -->
    <div id="mobile-more-overlay" class="hidden" onclick="MobileMenu.close()">
      <div id="mobile-more-sheet" onclick="event.stopPropagation()">
        <div class="mobile-more-handle"></div>
        <a class="mobile-more-item" onclick="MobileMenu.go('recherches')">🔍 <span data-i18n="nav_recherches">Recherches</span></a>
        <a class="mobile-more-item" onclick="MobileMenu.go('finance')">💰 Finance</a>
        <a class="mobile-more-item" onclick="MobileMenu.go('contracts')">📋 Contrats</a>
        <a class="mobile-more-item" onclick="MobileMenu.go('visas')">🛂 Visas</a>
        <div class="mobile-more-sep"></div>
        <a class="mobile-more-item" onclick="MobileMenu.close();App.openProfileModal()">👤 Profil</a>
        <a class="mobile-more-item danger" onclick="MobileMenu.close();document.getElementById('logout-btn').click()">⎋ Déconnexion</a>
      </div>
    </div>

    <!-- BOTTOM SHEET (actions rapides) -->
    <div id="action-sheet-overlay" class="hidden" onclick="ActionSheet.close()">
      <div id="action-sheet" onclick="event.stopPropagation()">
        <div class="action-sheet-handle"></div>
        <div id="action-sheet-title" class="action-sheet-title"></div>
        <div id="action-sheet-body" class="action-sheet-body"></div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close" aria-label="Fermer">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- PROPERTY DETAIL OVERLAY (mozaïque) -->
  <div id="prop-detail-overlay" class="hidden">
    <div id="prop-detail-modal">
      <button id="prop-detail-close" aria-label="Fermer" onclick="Properties.closeDetail()">✕</button>
      <!-- Gallery -->
      <div id="prop-detail-gallery" class="pdm-gallery"></div>
      <!-- Body -->
      <div class="pdm-body">
        <div class="pdm-left">
          <div class="pdm-title-row">
            <h2 id="pdm-title" class="pdm-title"></h2>
            <span id="pdm-badge" class="pdm-badge"></span>
          </div>
          <div class="pdm-price-row">
            <span id="pdm-price" class="pdm-price"></span>
            <span id="pdm-per" class="pdm-per"></span>
          </div>
          <div id="pdm-chips" class="pdm-chips-row"></div>
          <p id="pdm-desc" class="pdm-desc"></p>
          <div class="pdm-actions">
            <button class="btn btn-ghost btn-sm" onclick="Properties.closeDetail()">Fermer</button>
            <button id="pdm-edit-btn" class="btn btn-secondary btn-sm">Modifier</button>
            <button id="pdm-archive-btn" class="btn btn-ghost btn-sm"></button>
            <button id="pdm-share-btn" class="btn btn-primary btn-sm" style="margin-left:auto;display:none"><span>🔗</span> Lien client</button>
          </div>
        </div>
        <div class="pdm-right">
          <div id="pdm-stats" class="pdm-stats"></div>
          <div class="pdm-status-section">
            <div class="pdm-section-label">Statut</div>
            <div id="pdm-status-btns" class="pdm-status-btns"></div>
          </div>
          <div id="pdm-contact" class="pdm-contact-card"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toast-container"></div>

  <script src="/js/app.js?v=5"></script>
  <script src="/js/dashboard.js?v=5"></script>
  <script src="/js/clients.js?v=5"></script>
  <script src="/js/properties.js?v=4"></script>
  <script src="/js/deals.js?v=4"></script>
  <script src="/js/finance.js?v=4"></script>
  <script src="/js/contracts.js?v=3"></script>
  <script src="/js/recherches.js?v=3"></script>
  <script src="/js/visas.js?v=3"></script>
  <script src="/js/scraping.js?v=1"></script>
</body>
</html>
